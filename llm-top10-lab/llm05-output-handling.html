<figcaption>
  The attacker never speaks to the model. They leave the payload in a product review on Monday; on Tuesday an
  unrelated user asks for a summary, the app feeds that stored review to the model <em>as data</em>, and the model
  faithfully copies it through. Mitigation lives at step 7: <code>textContent</code> for display,
  HTML-encoding before a page, parameterised queries before a database, never a shell.
</figcaption>

<svg viewBox="0 0 1240 790" role="img"
     aria-label="A zoom into step 7. One string sits in a variable. Written with textContent the HTML parser is never called and the browser creates a single text node, so the characters are displayed and nothing is constructed. Written with innerHTML the parser tokenises the string, reads the img tag and its src and onerror attributes, constructs a real image element, registers the onerror value as an event handler and inserts it into the live page. The browser then tries to load the image source x, which does not exist, so the failure fires the onerror handler, which executes JavaScript inside the victim's session, reads document.cookie and triggers an outbound GET request to the attacker's domain with the cookie in the URL. The attacker simply reads their own web server access log. Notes explain that script tags inserted via innerHTML do not execute so attackers use event handlers, that the Same-Origin Policy restricts reading responses rather than sending requests, and that HttpOnly cookies defeat this payload but not cross-site scripting itself."
     font-family="Segoe UI, system-ui, sans-serif">

  <!-- three notes -->
  <rect x="60" y="576" width="360" height="124" rx="9" fill="#0f131c" stroke="#1e2637" stroke-width="1"/>
  <text x="78" y="598" font-size="10.5" font-weight="700" fill="#f0a93b">Why not just &lt;script&gt;?</text>
  <text x="78" y="620" font-size="8.8" fill="#c8d3e2">A &lt;script&gt; tag inserted via innerHTML does</text>
  <text x="78" y="634" font-size="8.8" fill="#c8d3e2">NOT execute — the HTML5 spec blocks it.</text>
  <text x="78" y="652" font-size="8.8" fill="#c8d3e2">So attackers use event handlers instead:</text>
  <text x="78" y="670" font-family="Consolas, monospace" font-size="8.5" fill="#f5a3a5">onerror   onload   onfocus   onmouseover</text>
  <text x="78" y="688" font-size="8.8" fill="#8b98ad">Those fire exactly as the spec intends.</text>

  <rect x="440" y="576" width="360" height="124" rx="9" fill="#0f131c" stroke="#1e2637" stroke-width="1"/>
  <text x="458" y="598" font-size="10.5" font-weight="700" fill="#f0a93b">Why doesn't the browser block it?</text>
  <text x="458" y="620" font-size="8.8" fill="#c8d3e2">Same-Origin Policy restricts READING a</text>
  <text x="458" y="634" font-size="8.8" fill="#c8d3e2">cross-origin response — not SENDING a</text>
  <text x="458" y="648" font-size="8.8" fill="#c8d3e2">request. Loading an image from another</text>
  <text x="458" y="662" font-size="8.8" fill="#c8d3e2">domain is ordinary web behaviour.</text>
  <text x="458" y="684" font-size="8.8" fill="#6ee7b7">CSP img-src / connect-src is what stops it.</text>

  <rect x="820" y="576" width="360" height="124" rx="9" fill="#0f131c" stroke="#1e2637" stroke-width="1"/>
  <text x="838" y="598" font-size="10.5" font-weight="700" fill="#f0a93b">HttpOnly is not a cure</text>
  <text x="838" y="620" font-size="8.8" fill="#c8d3e2">HttpOnly hides the cookie from JavaScript,</text>
  <text x="838" y="634" font-size="8.8" fill="#c8d3e2">defeating this exact payload. But the script</text>
  <text x="838" y="648" font-size="8.8" fill="#c8d3e2">still runs inside the session — it can call</text>
  <text x="838" y="662" font-family="Consolas, monospace" font-size="8" fill="#f5a3a5">fetch(api, {credentials:'include'})</text>
  <text x="838" y="684" font-size="8.8" fill="#c8d3e2">and change the victim's email directly.</text>

  <rect x="150" y="716" width="940" height="52" rx="10" fill="#14110a" stroke="#f0a93b" stroke-width="1.2"/>
  <text x="620" y="738" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f0a93b">Fix at the source: textContent to display, HTML-encode to render.</text>
  <text x="620" y="757" text-anchor="middle" font-size="9.5" fill="#c8d3e2">Defence in depth behind it: Content-Security-Policy, HttpOnly, SameSite. None of those replace handling the output correctly.</text>
</svg>
<figcaption>
  <code>textContent</code> stores characters; <code>innerHTML</code> invokes the parser, which constructs a real
  element and registers a real event handler. The handler runs in the victim's session, and any outbound request —
  even an image load — carries the data out in its URL. The attacker needs no response, only their own access log.
</figcaption>
